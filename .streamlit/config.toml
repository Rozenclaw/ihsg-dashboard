# COSMIC-AURORA premium theme. The deep visuals (aurora mesh, glow orbs, grain,
# glass cards, animations) are injected reliably via the iframe trick in
# src/theme.py (DOMPurify drops big <style> blocks from st.markdown). These
# NATIVE values set the near-black base + accent so the FIRST paint and all
# native widgets already match the cosmic palette before the CSS layer lands
# (minimises flash-of-unstyled-content). baseFontSize keeps MacBook-Air density.
[theme]
base = "dark"
primaryColor = "#818CF8"
backgroundColor = "#07070B"
secondaryBackgroundColor = "#0E0E1A"
textColor = "#F5F6FA"
font = "sans-serif"
baseFontSize = 14
baseRadius = "0.9rem"
borderColor = "#1c1c2b"
showWidgetBorder = true
showSidebarBorder = true
dataframeBorderColor = "#1c1c2b"
# Denser h1–h4 so section titles (###, ####) don't eat vertical space.
headingFontSizes = ["2.0rem", "1.6rem", "1.3rem", "1.05rem"]
# Chart palette matching the cosmic indigo / cyan / violet accents.
chartCategoricalColors = ["#818CF8", "#38E1F0", "#C084FC", "#34D399", "#FB7185"]

[server]
headless = true
# Reload ALL modules (incl. src/*) on change, not just dashboard.py — avoids
# stale-import bugs where new i18n keys show as raw "stack.title" text.
runOnSave = true
fileWatcherType = "auto"

[browser]
gatherUsageStats = false
