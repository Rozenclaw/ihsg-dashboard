# IHSG Dashboard configuration (Phase 0-1)
database:
  path: "data/ihsg.db"

data:
  # Primary source adapter: "yfinance" (live) or "synthetic" (offline test)
  source: "yfinance"
  index_symbol: "^JKSE"      # IDX Composite (IHSG)
  history_period: "5y"        # daily history to pull on refresh (covers the 5Y
                              # chart range so 1Y AND 5Y match the real data)
  history_interval: "1d"
  request_pause_sec: 1.0       # politeness delay between batched calls

indicators:
  sma_fast: 50
  sma_slow: 200
  rsi_period: 14
  bb_period: 20
  bb_std: 2.0

# Personal monthly stacking guide (DCA budget allocator)
stacking:
  monthly_budget_idr: 5000000   # your fixed monthly amount to stack
  num_stocks: 3                 # split across the top N BUY picks
  use_entry_price: true         # size at model entry (near support) vs last close

paper:
  starting_cash_idr: null     # null -> uses strategy.portfolio_idr
  max_positions: 10
  fee_bps: 15                 # simulated brokerage fee per side (0.15%)

strategy:
  weight_fundamental: 0.6     # composite = 0.6*fund + 0.4*tech
  weight_technical: 0.4
  min_yield_pct: 4.0          # dividend gate: must yield >= this to be buyable
  good_yield_pct: 8.0         # yield that earns near-full fundamental marks
  buy_threshold: 60.0         # composite >= this -> BUY (if gate passed)
  sell_threshold: 40.0        # composite < this -> SELL bias
  rsi_oversold: 40.0
  rsi_overbought: 70.0
  max_payout_pct: 100.0       # dividend payout above this flags yield-trap risk
  target_pct: 20.0            # profit target above entry
  stop_pct: 8.0               # stop-loss below entry
  risk_per_trade_pct: 1.5     # % of portfolio risked per position
  max_position_pct: 15.0      # max weight per name
  portfolio_idr: 100000000    # assumed capital for position sizing (tune in UI)
  min_history_days: 60

ai:
  # Optional AI research narrative on the Decision Helper page. Uses any
  # OpenAI-compatible provider via plain HTTP (no extra packages). Without a key
  # the page falls back to the built-in deterministic write-up.
  #
  # provider: gemini | groq | openrouter | ollama
  #   gemini     → free key (no card): https://aistudio.google.com/apikey
  #                set GEMINI_API_KEY (env or .streamlit/secrets.toml)
  #   groq       → free key: https://console.groq.com/keys  → GROQ_API_KEY
  #   openrouter → free key: https://openrouter.ai/keys     → OPENROUTER_API_KEY
  #   ollama     → local, no key (install from https://ollama.com)
  provider: "gemini"
  model: "gemini-2.5-flash"   # free-tier friendly; alt: gemini-2.5-flash-lite (lighter)
  # base_url: ""              # override for a custom OpenAI-compatible endpoint
  temperature: 0.4
  max_tokens: 6000            # headroom so the full note isn't truncated
  reasoning_effort: "low"     # caps Gemini 2.5 "thinking" so tokens go to text
                              # (blank it for providers that reject the field)

daytrade:
  # "Daily Trading" page — a daily-refreshed shortlist of liquid IDX names that
  # look like reasonable short-term SWING entries (NOT intraday scalping), with
  # strict risk control. Beginner-safe defaults; tune to your universe/account.
  top_n: 10                     # size of the daily shortlist
  min_turnover_idr: 5000000000  # liquidity gate: avg daily value traded (>= Rp5bn)
  atr_period: 14
  atr_mult_stop: 1.5            # stop = entry - 1.5*ATR ...
  min_stop_pct: 3.0             # ... but never tighter than 3% (whipsaw)
  max_stop_pct: 8.0             # ... and never risk more than 8% per trade
  atr_max_pct: 7.0              # too volatile for a beginner -> AVOID
  rr_target: 2.0                # target distance = 2x the stop distance (R:R = 2)
  rsi_overbought: 70.0          # day-score 0 above this; never BUY (don't chase)
  buy_score: 60.0               # day-score >= -> BUY (if safety filters pass)
  watch_score: 45.0             # day-score >= -> WATCH
  risk_warn_pct: 2.0            # warn if a day's total risk-at-stop exceeds this % of capital
  buy_fee_bps: 15.0             # broker fee on buy (~0.15%)
  sell_fee_bps: 25.0            # broker fee + 0.1% sell tax on sell (~0.25%)
  default_capital_idr: 10000000     # total trading capital (simulation default)
  default_daily_budget_idr: 1000000 # today's budget to allocate (simulation default)

live:
  # Quotes overlay for the "Live" panel.
  #   provider: "yahoo"  -> delayed ~15 min via yfinance. NO API key, NO quota,
  #                         one batch call. Recommended default (reliable).
  #   provider: "itick"  -> iTick realtime REST (needs a key, free tier is
  #                         heavily rate-limited / can return "auth failed").
  #                         Set the key via env ITICK_TOKEN or
  #                         .streamlit/secrets.toml; get one at https://itick.org
  provider: "yahoo"
  enabled: true
  region: "ID"
  poll_seconds: 60        # how often the live panel auto-refreshes
  cache_seconds: 90       # cache quotes this long (clamped 60-120s) so repeated
                          # reruns reuse one provider call instead of re-fetching
  max_symbols: 15         # keep small (esp. for iTick's rate limits)

dashboard:
  default_watchlist:
    - BBRI.JK
    - BMRI.JK
    - BBNI.JK
    - BBCA.JK
    - TLKM.JK
    - ASII.JK
    - PTBA.JK
    - ITMG.JK
    - ADRO.JK
    - UNTR.JK
